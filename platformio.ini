; PlatformIO project for the Air-Condition Remote Gateway (ESP32-WROOM-32E)
; Framework: Arduino-ESP32. See docs/ for design, plan and protocol notes.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    olikraus/U8g2@^2.35.19
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=3
