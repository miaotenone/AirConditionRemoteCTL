; PlatformIO project for the Air-Condition Remote Gateway (ESP32-WROOM-32E)
; Framework: Arduino-ESP32. See docs/ for design, plan and protocol notes.

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    olikraus/U8g2@2.36.18
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.6
    tzapu/WiFiManager@2.0.17
    beegee-tokyo/DHT sensor library for ESPx@1.19

build_flags =
    -DCORE_DEBUG_LEVEL=3

; Stamp the build with the git revision so the boot banner can name it
; (src/version.h). Loaded before the compile; a tree without git still builds.
extra_scripts = pre:scripts/git_version.py

; ---------------------------------------------------------------------------
; Hardware bring-up self-test firmware (NO WiFi / NO MQTT).
;   python -m platformio run -e selftest -t upload
;   python -m platformio device monitor
; Ports auto-detect. With several USB serial devices attached, add
;   --upload-port COM11  /  -p COM11
; The COM number changes when the board is replugged (COM16 -> COM11).
; Only drives the OLED (I2C) and the IR module (UART2) from a serial menu.
; ---------------------------------------------------------------------------
[env:selftest]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DAC_SELFTEST=1
    -DCORE_DEBUG_LEVEL=1

; The self-test firmware shows its revision on the boot banner too (version.h).
extra_scripts = pre:scripts/git_version.py

; drop the network/config/sensor units so no extra libs are pulled in
build_src_filter = +<*> -<main.cpp> -<net_mqtt.cpp> -<web_config.cpp> -<config_store.cpp> -<state_store.cpp> -<serial_console.cpp> -<dht_sensor.cpp>

lib_deps =
    olikraus/U8g2@2.36.18
